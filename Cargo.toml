[workspace]
members = ["apps/api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Image decoding, resizing and encoding crawl unoptimised, even in tests.
[profile.dev.package]
image.opt-level = 3
zune-jpeg.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
image-webp.opt-level = 3
zenwebp.opt-level = 3
tiny-skia.opt-level = 3
