[workspace]
resolver = "3"
members = ["apps/api"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Argon2 is deliberately expensive; unoptimised it makes the sign-in tests slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The image pipeline decodes, resizes and encodes whole photos; unoptimised it
# makes the media tests take minutes.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3
