name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded pull request runs; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Check the pull request's own commits, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from="origin/$BASE_REF"
          else
            from="$PUSH_BEFORE"
          fi
          just check-commits "$from"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: just lint
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses bans sources

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pranata
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pranata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          sqlx-cli: "true"
      # Service containers start before checkout, so the init SQL is applied here.
      # The justfile's default DATABASE_URL already points at 127.0.0.1:55432.
      - name: Apply the database init SQL
        run: psql "postgres://postgres@127.0.0.1:55432/pranata" -v ON_ERROR_STOP=1 -f infra/dev/postgres-init.sql
      - run: just db-migrate
      - run: just check-sqlx
      - run: just test

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - run: just check-contract

  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just check-trace

  # Build both images once; the gates below load them instead of rebuilding.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          js: "false"
      - run: just images
      - name: Save the images
        run: |
          podman save --multi-image-archive localhost/pranata-api:local localhost/pranata-web:local | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: tools/ci/setup-rootless-podman.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: podman load --input images.tar.gz
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: just e2e
        env:
          PRANATA_SKIP_IMAGES: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  perf:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: tools/ci/setup-rootless-podman.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: podman load --input images.tar.gz
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: just perf
        env:
          PRANATA_SKIP_IMAGES: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: target/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  load:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          js: "false"
      - run: tools/ci/setup-rootless-podman.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: podman load --input images.tar.gz
      - run: just load
        env:
          PRANATA_SKIP_IMAGES: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: target/load
          if-no-files-found: ignore
          retention-days: 7
