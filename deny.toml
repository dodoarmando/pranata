# cargo-deny policy (D-44, D-45). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin Attack: RSA private-key operations leak timing. webauthn-rs pulls
    # in rsa 0.10.0-rc (through crypto-glue), which the advisory still matches
    # because a release candidate sorts before 0.10.0. Pranata only verifies
    # RSA signatures of Passkeys and never decrypts or signs with a private key.
    { id = "RUSTSEC-2023-0071", reason = "Pranata only verifies RSA signatures and never decrypts with a private key" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Any licence not listed here fails the job. BSD-3-Clause also covers the
# libwebp licence.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
