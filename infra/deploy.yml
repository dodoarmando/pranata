---
# Moves Installations to `pranata_version` (-e pranata_version=x.y.z). A failed
# health check rolls the host back to the version it ran before.
- name: Deploy a Pranata version
  hosts: all
  become: true
  # One host at a time: a bad release stops after the first failure.
  serial: 1
  tasks:
    - name: Check the version is given
      ansible.builtin.assert:
        that: pranata_version | default('') | length > 0
        fail_msg: Pass the version with -e pranata_version=x.y.z
        quiet: true

    - name: Learn the user's runtime directory
      ansible.builtin.import_role:
        name: pranata
        tasks_from: user_env.yml

    - name: Look up the release that runs now
      ansible.builtin.import_role:
        name: pranata
        tasks_from: current_release.yml

    - name: Refuse an Installation that was never provisioned
      ansible.builtin.assert:
        that: pranata_running_release | length > 0
        fail_msg: "{{ inventory_hostname }} has no pranata-api unit; run just provision first."
        quiet: true

    - name: Remember the version to return to
      ansible.builtin.set_fact:
        pranata_previous: "{{ pranata_running_release }}"

    - name: Deploy with a rollback on failure
      block:
        - name: Record the current version
          ansible.builtin.copy:
            dest: "{{ pranata_home }}/.pranata-version"
            content: "{{ pranata_previous }}\n"
            owner: "{{ pranata_user }}"
            group: "{{ pranata_user }}"
            mode: "0644"

        - name: Move to the new version
          ansible.builtin.include_role:
            name: pranata
            tasks_from: release.yml
          vars:
            pranata_release: "{{ pranata_version }}"
      rescue:
        - name: Roll back to the previous version
          block:
            - name: Move back to the previous version
              ansible.builtin.include_role:
                name: pranata
                tasks_from: release.yml
              vars:
                pranata_release: "{{ pranata_previous }}"
          rescue:
            - name: Report the failed rollback
              ansible.builtin.fail:
                msg: >-
                  ROLLBACK FAILED on {{ inventory_hostname }}: still on
                  {{ pranata_version }}; site may be down. Previous version was
                  {{ pranata_previous }}.

        - name: Report the failed deploy
          ansible.builtin.fail:
            msg: >-
              Deploying {{ pranata_version }} failed its health check;
              rolled back to {{ pranata_previous }}.
