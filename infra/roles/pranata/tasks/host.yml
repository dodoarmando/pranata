---
- name: Install packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - sudo
      - nftables
      - podman
      - netavark
      - aardvark-dns
      - passt
      - uidmap
      - dbus-user-session
      # Lets Ansible hand module files to the unprivileged pranata user.
      - acl
    update_cache: true
    cache_valid_time: 3600

- name: Turn on unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# Created before SSH turns off root login, so the Vendor keeps a way in.
- name: Create the Vendor's login user
  ansible.builtin.user:
    name: "{{ pranata_vendor_user }}"
    shell: /bin/bash

- name: Authorize the Vendor's SSH keys
  ansible.posix.authorized_key:
    user: "{{ pranata_vendor_user }}"
    key: "{{ pranata_vendor_ssh_keys | join('\n') }}"
    exclusive: true

- name: Give the Vendor passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ pranata_vendor_user }}
    content: "{{ pranata_vendor_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Allow SSH by key only, without root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/pranata.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Open only SSH, HTTP and HTTPS
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload the firewall

- name: Start the firewall at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

# Lets caddy.socket, owned by the pranata user, listen on 80 and 443.
- name: Let unprivileged users bind ports from 80
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    sysctl_file: /etc/sysctl.d/90-pranata.conf
