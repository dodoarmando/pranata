---
# Point the api and web units at `pranata_release`, restart them (the api runs
# the migrations when it starts) and wait until the new version answers. The
# images are pulled first, so a missing tag changes nothing.
- name: Pull the images for the release
  ansible.builtin.command:
    argv:
      [
        podman,
        pull,
        --quiet,
        "{{ pranata_image_registry }}/{{ item }}:{{ pranata_release }}",
      ]
  loop:
    - pranata-api
    - pranata-web
  when: pranata_pull_images | bool
  changed_when: false
  become: true
  become_user: "{{ pranata_user }}"
  environment: "{{ pranata_user_env }}"

- name: Render the api and web units for the release
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pranata_home }}/.config/containers/systemd/{{ item }}"
    owner: "{{ pranata_user }}"
    group: "{{ pranata_user }}"
    mode: "0600"
  diff: false
  loop:
    - pranata-api.container
    - pranata-web.container

- name: Reload the units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ pranata_user }}"
  environment: "{{ pranata_user_env }}"

- name: Restart the api, which runs the migrations
  ansible.builtin.systemd:
    name: pranata-api.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ pranata_user }}"
  environment: "{{ pranata_user_env }}"

- name: Restart the web server
  ansible.builtin.systemd:
    name: pranata-web.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ pranata_user }}"
  environment: "{{ pranata_user_env }}"

- name: Wait until the release is healthy
  ansible.builtin.import_tasks: wait_healthy.yml
