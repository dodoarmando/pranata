---
- name: Check the Administrator variables
  ansible.builtin.assert:
    that:
      - pranata_admin_username | length > 0
      - pranata_admin_name | length > 0
      - pranata_admin_username is regex('^[a-z0-9._-]{3,64}$')
    fail_msg: >-
      pranata_admin_username must be 3 to 64 characters of a-z, 0-9, dot,
      underscore or hyphen, and pranata_admin_name must not be empty.
    quiet: true
