---
# Password and root logins are turned off, so refuse to do it unless the user
# Ansible connects as can still get in: not root, and with an authorized key.
- name: Learn which user Ansible connects as
  ansible.builtin.command: id -un
  register: pranata_connect_user
  changed_when: false
  become: false

- name: Refuse to lock out a root connection
  ansible.builtin.assert:
    that: pranata_connect_user.stdout != 'root'
    fail_msg: >-
      Ansible connects as root, and this role turns off SSH root login.
      Create a user with sudo rights and authorized keys, set ansible_user to it
      in the inventory, and run again (or skip this with --skip-tags ssh).
    quiet: true

- name: Look up the connecting user's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ pranata_connect_user.stdout }}"

- name: Look for the connecting user's authorized keys
  ansible.builtin.stat:
    path: "{{ getent_passwd[pranata_connect_user.stdout][4] }}/.ssh/authorized_keys"
  register: pranata_authorized_keys

- name: Refuse to turn off passwords without an authorized key
  ansible.builtin.assert:
    that:
      - pranata_authorized_keys.stat.exists
      - pranata_authorized_keys.stat.size > 0
    fail_msg: >-
      {{ pranata_connect_user.stdout }} has no non-empty
      ~/.ssh/authorized_keys on {{ inventory_hostname }}, and this role turns
      off SSH password login. Add your public key there (ssh-copy-id), and run again.
    quiet: true

- name: Disable password and root login over SSH
  block:
    - name: Install the sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-pranata.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
      notify: Reload sshd

    # Checks the whole configuration, as sshd would read it with the drop-in.
    - name: Check the combined sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
  rescue:
    - name: Remove the drop-in that does not validate
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-pranata.conf
        state: absent

    - name: Report the invalid sshd configuration
      ansible.builtin.fail:
        msg: The sshd configuration with the Pranata drop-in did not validate; the drop-in was removed and sshd was not reloaded.
