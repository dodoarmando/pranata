---
- name: Disable password and root login over SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-pranata.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
