---
- name: Install the nftables rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Enable nftables at boot
  ansible.builtin.service:
    name: nftables
    enabled: true
