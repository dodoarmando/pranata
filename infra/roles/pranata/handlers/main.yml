---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: restarted

- name: Reload user systemd units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ pranata_user }}"
  environment: "{{ pranata_user_env }}"
