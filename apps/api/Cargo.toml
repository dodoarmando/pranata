[package]
name = "pranata"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
fast_image_resize = "6.2.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
governor = { version = "0.10.4", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.5", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "uuid", "time"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["request-id", "trace", "propagate-header"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
kamadak-exif = "0.6.2"
tower = { version = "0.5.3", features = ["util"] }
