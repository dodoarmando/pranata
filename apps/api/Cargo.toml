[package]
name = "pranata"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.11"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["request-id", "trace", "propagate-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
