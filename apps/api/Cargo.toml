[package]
name = "pranata"
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
resvg = { version = "0.50.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
webauthn-rs = "0.6.2"
webauthn-rs-proto = "0.6.2"
zenwebp = "0.4.6"
zip = { version = "9.7.3", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1.5"
p256 = "0.14.0"
tempfile = "3.27.0"

[lints]
workspace = true
